
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="pzMre7ZjzCBFKWlRMjv1YFe60SMHzOE9Tiu3wqQsNj0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taha'nın Hesap Makinesi</title>

    <style>
        body {
            background-color: lightblue;
            text-align: center;
            font-family: Arial;
        }

        .hesap {
            background-color: white;
            width: 250px;
            margin: 100px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            width: 220px;
            height: 35px;
            font-size: 20px;
            margin-bottom: 10px;
        }

        button {
            width: 50px;
            height: 40px;
            margin: 3px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="hesap">

        <h2>Hesap Makinesi</h2>

        <input type="text" id="sonuc" readonly>

        <br>

        <button onclick="ekle('7')">7</button>
        <button onclick="ekle('8')">8</button>
        <button onclick="ekle('9')">9</button>
        <button onclick="ekle('+')">+</button>

        <br>

        <button onclick="ekle('4')">4</button>
        <button onclick="ekle('5')">5</button>
        <button onclick="ekle('6')">6</button>
        <button onclick="ekle('-')">-</button>

        <br>

        <button onclick="ekle('1')">1</button>
        <button onclick="ekle('2')">2</button>
        <button onclick="ekle('3')">3</button>
        <button onclick="ekle('*')">*</button>

        <br>

        <button onclick="ekle('0')">0</button>
        <button onclick="temizle()">C</button>
        <button onclick="hesapla()">=</button>
        <button onclick="ekle('/')">/</button>

    </div>

    <script>
        function ekle(deger) {
            document.getElementById("sonuc").value += deger;
        }

        function temizle() {
            document.getElementById("sonuc").value = "";
        }

        function hesapla() {
            try {
                document.getElementById("sonuc").value =
                    eval(document.getElementById("sonuc").value);
            }
            catch {
                document.getElementById("sonuc").value = "Hata";
            }
        }
    </script>

</body>
</html>
